<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мій Банк</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        @font-face { font-family: 'Manrope'; src: url('Manrope.ttf'); }
        @font-face { font-family: 'Manrope-Bold'; src: url('Manrope-Bold.ttf'); }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; color: white; overflow: hidden;
            font-family: 'Manrope', sans-serif;
        }

        .container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: url('photo.png') no-repeat center/100% 100%;
        }

        .editable { 
            position: absolute; border: none; background: transparent; 
            color: inherit; font-family: inherit; outline: none; white-space: nowrap; 
        }

        /* --- КАРТКА ТА БАЛАНС --- */
        #card_digits { left: 24%; top: 34%; font-size: 1.8vh; }
        #card_date   { left: 37%; top: 34%; font-size: 1.8vh; }
        #balance     { right: 17.5%; top: 40.9%; font-size: 2.5vh; width: 60%; text-align: right; }
        #balance span { font-size: 1.9vh; } /* Копійки в балансі */

        /* --- ЗАГАЛЬНИЙ СТИЛЬ ІКОНОК --- */
        .transaction-icon {
            position: absolute;
            object-fit: contain;
            pointer-events: none;
            width: 7.5vh; height: 7.5vh;
        }

        /* --- ПЕРША ТРАНЗАКЦІЯ (ID 1) --- */
        #img_1  { left: 5.5%; top: 70.5%; } /* Іконка 1 */
        #name_1 { left: 20%;   top: 69.95%; font-family: 'Manrope-Bold'; font-size: 1.6vh; } /* Назва 1 */
        #date_1 { left: 20%;   top: 72.55%; font-family: 'Manrope-Bold'; font-size: 1.4vh; color: #888; } /* Дата 1 */
        #cont_1 { right: 7.5%;  top: 69.95%; } /* Сума 1 */

        /* --- ДРУГА ТРАНЗАКЦІЯ (ID 2) --- */
        #img_2  { left: 5.5%; top: 77.2%; } /* Іконка 2 */
        #name_2 { left: 20%;   top: 76.65%; font-family: 'Manrope-Bold'; font-size: 1.6vh; } /* Назва 2 */
        #date_2 { left: 20%;   top: 79.25%; font-family: 'Manrope-Bold'; font-size: 1.4vh; color: #888; } /* Дата 2 */
        #cont_2 { right: 7.5%;  top: 76.65%; } /* Сума 2 */

        /* --- ТРЕТЯ ТРАНЗАКЦІЯ (ID 3) --- */
        #img_3  { left: 5.5%; top: 84.05%; }  /* Іконка 3 */
        #name_3 { left: 20%;   top: 83.5%; font-family: 'Manrope-Bold'; font-size: 1.6vh; } /* Назва 3 */
        #date_3 { left: 20%;   top: 86.1%; font-family: 'Manrope-Bold'; font-size: 1.4vh; color: #888; } /* Дата 3 */
        #cont_3 { right: 7.5%;  top: 83.5%; }  /* Сума 3 */

        /* --- СПІЛЬНІ СТИЛІ СУМ --- */
        .sum-container { position: absolute; display: flex; align-items: baseline; justify-content: flex-end; width: 45%; }
        .plus { color: #5cc033 !important; }
        .minus { color: #ccc !important; }
        .small-text { font-size: 1.5vh; font-family: 'Manrope-Bold'; } /* Розмір копійок та UAH */
        .uah { margin-left: 4px; }
        .sum-val { position: static !important; font-family: 'Manrope-Bold'; font-size: 1.8vh; }
    </style>
</head>
<body>
    <div class="container">
        <div id="card_digits" class="editable" contenteditable="true">4504</div>
        <div id="card_date" class="editable" contenteditable="true">15/15</div>
        <div id="balance" class="editable" contenteditable="true">55 345<span>.50</span></div>

        <img id="img_1" src="minus.png" class="transaction-icon">
        <div id="name_1" class="editable" contenteditable="true">Сільпо</div>
        <div id="date_1" class="editable" contenteditable="true">20 лютого, 23:49</div>
        <div id="cont_1" class="sum-container">
            <div id="sum_1" class="editable sum-val" contenteditable="true">- 150.00</div>
            <span class="uah small-text">UAH</span>
        </div>

        <img id="img_2" src="plus.png" class="transaction-icon">
        <div id="name_2" class="editable" contenteditable="true">Богаткін Д.</div>
        <div id="date_2" class="editable" contenteditable="true">20 лютого, 23:48</div>
        <div id="cont_2" class="sum-container">
            <div id="sum_2" class="editable sum-val" contenteditable="true">+ 1 200.00</div>
            <span class="uah small-text">UAH</span>
        </div>

        <img id="img_3" src="plus.png" class="transaction-icon">
        <div id="name_3" class="editable" contenteditable="true">PAYSEND</div>
        <div id="date_3" class="editable" contenteditable="true">20 лютого, 23:26</div>
        <div id="cont_3" class="sum-container">
            <div id="sum_3" class="editable sum-val" contenteditable="true">+ 2 400.00</div>
            <span class="uah small-text">UAH</span>
        </div>
    </div>

    <script>
        function updateRow(el) {
            const text = el.innerText.trim();
            const container = el.parentElement;
            const id = el.id.split('_')[1];
            const img = document.getElementById('img_' + id);

            // Автоматична заміна картинки та кольору залежно від знаку
            if (text.startsWith('+')) {
                container.classList.remove('minus');
                container.classList.add('plus');
                img.src = 'plus.png?v=' + Date.now();
            } else {
                container.classList.remove('plus');
                container.classList.add('minus');
                img.src = 'minus.png?v=' + Date.now();
            }

            // Робимо копійки маленькими автоматично
            if (text.includes('.') && !el.querySelector('.small-text')) {
                const parts = text.split('.');
                el.innerHTML = parts[0] + '<span class="small-text">.' + parts[1] + '</span>';
                
                const range = document.createRange();
                const sel = window.getSelection();
                range.selectNodeContents(el);
                range.collapse(false);
                sel.removeAllRanges();
                sel.addRange(range);
            }
        }

        document.querySelectorAll('.sum-val').forEach(input => {
            updateRow(input);
            input.addEventListener('input', () => updateRow(input));
        });
    </script>
</body>
</html>
