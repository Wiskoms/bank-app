<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bank Debug Mode</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <style>
        body { background: #000; color: #0f0; padding: 20px; font-family: monospace; font-size: 12px; }
        #log { white-space: pre-wrap; }
    </style>
</head>
<body>
    <div id="log">Ініціалізація системи...</div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const logElement = document.getElementById('log');
        function print(text) { logElement.innerText += "\n" + text; }

        async function start() {
            try {
                print("Завантаження Pyodide...");
                let pyodide = await loadPyodide();
                
                print("Встановлення micropip...");
                await pyodide.loadPackage("micropip");
                const micropip = pyodide.pyimport("micropip");
                
                print("Встановлення Kivy (це триватиме ~30 сек)...");
                await micropip.install("kivy");
                
                print("Читання main.py...");
                const response = await fetch("main.py");
                if (!response.ok) throw new Error("Файл main.py не знайдено на сервері!");
                const code = await response.text();
                
                print("Запуск коду...");
                document.getElementById('canvas').style.display = 'block';
                logElement.style.display = 'none';
                
                await pyodide.runPythonAsync(code);
            } catch (err) {
                print("\n❌ КРИТИЧНА ПОМИЛКА:\n" + err.message);
                console.error(err);
            }
        }
        start();
    </script>
</body>
</html>
