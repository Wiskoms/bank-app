<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Мій Банк</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; overflow: hidden; }
        #canvas { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script type="text/javascript">
        async function main() {
            let pyodide = await loadPyodide();
            // Завантаження бібліотеки Kivy для вебу
            await pyodide.loadPackage("micropip");
            const micropip = pyodide.pyimport("micropip");
            await micropip.install("kivy");
            
            // Читання твого файлу main.py
            let pythonCode = await (await fetch("main.py")).text();
            pyodide.runPython(pythonCode);
        }
        main();
    </script>
</body>
</html>
