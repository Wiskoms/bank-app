<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=360, user-scalable=no">
    <title>Мій Банк</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        @font-face { font-family: 'Manrope'; src: url('Manrope.ttf'); }
        @font-face { font-family: 'Manrope-Bold'; src: url('Manrope-Bold.ttf'); }

        body, html {
            margin: 0; padding: 0; width: 360px; height: 800px;
            background-color: black; color: white; overflow: hidden;
            font-family: 'Manrope', sans-serif;
        }

        .container {
            position: relative; 
            width: 360px; /* Фіксована ширина як у Thonny */
            height: 800px; /* Фіксована висота як у Thonny */
            background: url('photo.png') no-repeat;
            background-size: 360px 800px;
        }

        .editable { 
            position: absolute; 
            border: none; 
            background: transparent; 
            color: inherit; 
            font-family: inherit; 
            outline: none;
            white-space: nowrap;
        }

        /* =========================================
           КАРТКА ТА БАЛАНС
           ========================================= */

        /* Останні 4 цифри карти */
        #card_digits { 
            left: 105px; 
            top: 282px; 
            font-size: 14px; 
        }

        /* Термін дії карти */
        #card_date { 
            left: 151px; 
            top: 282px; 
            font-size: 14px; 
        }

        /* Головний баланс */
        #balance {
            left: 110px; 
            top: 340px; 
            font-size: 21px; 
            width: 200px;
            text-align: right;
        }
        #balance span { font-size: 16px; } /* Копійки після крапки */

        /* =========================================
           ІСТОРІЯ ТРАНЗАКЦІЙ
           ========================================= */

        /* --- ПЕРША ТРАНЗАКЦІЯ --- */
        #name_1 { left: 58px; top: 558px; font-family: 'Manrope-Bold'; font-size: 12.5px; }
        #date_1 { left: 58px; top: 576px; font-family: 'Manrope-Bold'; font-size: 11.5px; color: #888; }
        #sum_1  { left: 240px; top: 558px; font-family: 'Manrope-Bold'; font-size: 13.5px; text-align: right; width: 80px; }

        /* --- ДРУГА ТРАНЗАКЦІЯ --- */
        #name_2 { left: 58px; top: 612px; font-family: 'Manrope-Bold'; font-size: 12.5px; }
        #date_2 { left: 58px; top: 630px; font-family: 'Manrope-Bold'; font-size: 11.5px; color: #888; }
        #sum_2  { left: 240px; top: 612px; font-family: 'Manrope-Bold'; font-size: 13.5px; text-align: right; width: 80px; }

        /* --- ТРЕТЯ ТРАНЗАКЦІЯ --- */
        #name_3 { left: 58px; top: 666px; font-family: 'Manrope-Bold'; font-size: 12.5px; }
        #date_3 { left: 58px; top: 684px; font-family: 'Manrope-Bold'; font-size: 11.5px; color: #888; }
        #sum_3  { left: 240px; top: 666px; font-family: 'Manrope-Bold'; font-size: 13.5px; text-align: right; width: 80px; }

        /* Кольори сум */
        .plus { color: #5cc033; }
        .minus { color: #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <div id="card_digits" class="editable" contenteditable="true">4504</div>
        <div id="card_date" class="editable" contenteditable="true">15/15</div>

        <div id="balance" class="editable" contenteditable="true">55 345<span>.50</span></div>

        <div id="name_1" class="editable" contenteditable="true">Сільпо</div>
        <div id="date_1" class="editable" contenteditable="true">20 лютого, 23:49</div>
        <div id="sum_1" class="editable minus" contenteditable="true">- 150.00</div>

        <div id="name_2" class="editable" contenteditable="true">Богаткін Д.</div>
        <div id="date_2" class="editable" contenteditable="true">20 лютого, 23:48</div>
        <div id="sum_2" class="editable plus" contenteditable="true">+ 1 200.00</div>

        <div id="name_3" class="editable" contenteditable="true">PAYSEND</div>
        <div id="date_3" class="editable" contenteditable="true">20 лютого, 23:26</div>
        <div id="sum_3" class="editable plus" contenteditable="true">+ 2 400.00</div>
    </div>
</body>
</html>
