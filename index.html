<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=360, user-scalable=no, viewport-fit=cover">
    <title>Мій Банк</title>
    <link rel="manifest" href="manifest.json">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        @font-face { font-family: 'Manrope'; src: url('Manrope.ttf'); }
        @font-face { font-family: 'Manrope-Bold'; src: url('Manrope-Bold.ttf'); }

        body, html {
            margin: 0; padding: 0; width: 360px; height: 100vh;
            background-color: black; color: white; overflow: hidden;
            font-family: 'Manrope', sans-serif;
        }

        .container {
            position: absolute;
            top: 0; /* Піднімаємо в самий верх */
            left: 0;
            width: 360px;
            height: 100vh; /* Висота на весь екран телефона */
            background: url('photo.png') no-repeat;
            background-size: 100% 100%; /* Фото розтягується рівно по контейнеру */
            background-position: top center;
        }

        .editable { 
            position: absolute; 
            border: none; 
            background: transparent; 
            color: inherit; 
            font-family: inherit; 
            outline: none;
            white-space: nowrap;
        }

        /* --- КООРДИНАТИ (Редагуй цифри top та left) --- */

        /* Останні 4 цифри карти */
        #card_digits { left: 105px; top: 1px; font-size: 14px; }

        /* Термін дії карти */
        #card_date { left: 151px; top: 1px; font-size: 14px; }

        /* Головний баланс */
        #balance {
            left: 110px; top: 280px; font-size: 21px; width: 200px;
            text-align: right;
        }
        #balance span { font-size: 16px; }

        /* ІСТОРІЯ 1 */
        #name_1 { left: 58px; top: 460px; font-family: 'Manrope-Bold'; font-size: 12.5px; }
        #date_1 { left: 58px; top: 478px; font-family: 'Manrope-Bold'; font-size: 11.5px; color: #888; }
        #sum_1  { left: 240px; top: 460px; font-family: 'Manrope-Bold'; font-size: 13.5px; text-align: right; width: 80px; }

        /* ІСТОРІЯ 2 */
        #name_2 { left: 58px; top: 515px; font-family: 'Manrope-Bold'; font-size: 12.5px; }
        #date_2 { left: 58px; top: 533px; font-family: 'Manrope-Bold'; font-size: 11.5px; color: #888; }
        #sum_2  { left: 240px; top: 515px; font-family: 'Manrope-Bold'; font-size: 13.5px; text-align: right; width: 80px; }

        /* ІСТОРІЯ 3 */
        #name_3 { left: 58px; top: 570px; font-family: 'Manrope-Bold'; font-size: 12.5px; }
        #date_3 { left: 58px; top: 588px; font-family: 'Manrope-Bold'; font-size: 11.5px; color: #888; }
        #sum_3  { left: 240px; top: 570px; font-family: 'Manrope-Bold'; font-size: 13.5px; text-align: right; width: 80px; }

        .plus { color: #5cc033; }
        .minus { color: #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <div id="card_digits" class="editable" contenteditable="true">4504</div>
        <div id="card_date" class="editable" contenteditable="true">15/15</div>

        <div id="balance" class="editable" contenteditable="true">55 345<span>.50</span></div>

        <div id="name_1" class="editable" contenteditable="true">Сільпо</div>
        <div id="date_1" class="editable" contenteditable="true">20 лютого, 23:49</div>
        <div id="sum_1" class="editable minus" contenteditable="true">- 150.00</div>

        <div id="name_2" class="editable" contenteditable="true">Богаткін Д.</div>
        <div id="date_2" class="editable" contenteditable="true">20 лютого, 23:48</div>
        <div id="sum_2" class="editable plus" contenteditable="true">+ 1 200.00</div>

        <div id="name_3" class="editable" contenteditable="true">PAYSEND</div>
        <div id="date_3" class="editable" contenteditable="true">20 лютого, 23:26</div>
        <div id="sum_3" class="editable plus" contenteditable="true">+ 2 400.00</div>
    </div>
</body>
</html>
