<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Мій Банк</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #status { color: #555; font-family: sans-serif; position: absolute; }
    </style>
</head>
<body>
    <div id="status">Завантаження банку...</div>
    <canvas id="canvas"></canvas>

    <script type="text/javascript">
        async function runApp() {
            const status = document.getElementById('status');
            try {
                let pyodide = await loadPyodide();
                status.innerText = "Готуємо компоненти...";
                
                await pyodide.loadPackage("micropip");
                const micropip = pyodide.pyimport("micropip");
                
                // Встановлюємо Kivy та залежності
                await micropip.install("kivy");
                
                status.innerText = "Запуск інтерфейсу...";
                const response = await fetch("main.py");
                const code = await response.text();
                
                status.style.display = 'none'; // Ховаємо текст завантаження
                pyodide.runPython(code);
            } catch (e) {
                status.innerText = "Помилка завантаження. Спробуйте оновити сторінку.";
                console.error(e);
            }
        }
        runApp();
    </script>
</body>
</html>
