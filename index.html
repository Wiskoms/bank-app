<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мій Банк</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        @font-face { font-family: 'Manrope'; src: url('Manrope.ttf'); }
        @font-face { font-family: 'Manrope-Bold'; src: url('Manrope-Bold.ttf'); }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; color: white; overflow: hidden;
            font-family: 'Manrope', sans-serif;
        }

        .container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; 
            height: 100vh;
            background: url('photo.png') no-repeat;
            background-size: 100% 100%; /* Фото завжди на весь екран */
        }

        .editable { 
            position: absolute; 
            border: none; 
            background: transparent; 
            color: inherit; 
            font-family: inherit; 
            outline: none;
            white-space: nowrap;
        }

        /* =========================================
           ЯК РУХАТИ:
           left: 50% — це рівно посередині.
           top: 0% — самий верх, 100% — самий низ.
           ========================================= */

        /* Останні 4 цифри карти (було 105px/800px) */
        #card_digits { 
            left: 25%; 
            top: 34%; 
            font-size: 1.8vh; /* Розмір шрифту теж у % від висоти екрана */
        }

        /* Термін дії карти */
        #card_date { 
            left: 39%; 
            top: 34%; 
            font-size: 1.8vh; 
        }

        /* Головний баланс */
        #balance {
            right: 17.5%; /* Відступ від правого краю */
            top: 40.5%; 
            font-size: 2.8vh; 
            width: 60%;
            text-align: right;
        }
        #balance span { font-size: 2.1vh; }

        /* --- ІСТОРІЯ 1 --- */
        #name_1 { left: 16.1%; top: 71%; font-family: 'Manrope-Bold'; font-size: 1.6vh; }
        #date_1 { left: 16.1%; top: 73.3%; font-family: 'Manrope-Bold'; font-size: 1.4vh; color: #888; }
        #sum_1  { right: 15%; top: 69.8%; font-family: 'Manrope-Bold'; font-size: 1.7vh; text-align: right; width: 30%; }

        /* --- ІСТОРІЯ 2 --- */
        #name_2 { left: 16.1%; top: 77.8%; font-family: 'Manrope-Bold'; font-size: 1.6vh; }
        #date_2 { left: 16.1%; top: 68.9%; font-family: 'Manrope-Bold'; font-size: 1.4vh; color: #888; }
        #sum_2  { right: 15%; top: 77.8%; font-family: 'Manrope-Bold'; font-size: 1.7vh; text-align: right; width: 30%; }

        /* --- ІСТОРІЯ 3 --- */
        #name_3 { left: 16.1%; top: 84.7%; font-family: 'Manrope-Bold'; font-size: 1.6vh; }
        #date_3 { left: 16.1%; top: 75.8%; font-family: 'Manrope-Bold'; font-size: 1.4vh; color: #888; }
        #sum_3  { right: 10%; top: 84.7%; font-family: 'Manrope-Bold'; font-size: 1.7vh; text-align: right; width: 30%; }

        .plus { color: #5cc033; }
        .minus { color: #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <div id="card_digits" class="editable" contenteditable="true">4504</div>
        <div id="card_date" class="editable" contenteditable="true">15/15</div>

        <div id="balance" class="editable" contenteditable="true">55 345<span>.50</span></div>

        <div id="name_1" class="editable" contenteditable="true">Сільпо</div>
        <div id="date_1" class="editable" contenteditable="true">20 лютого, 23:49</div>
        <div id="sum_1" class="editable minus" contenteditable="true">- 150.00</div>

        <div id="name_2" class="editable" contenteditable="true">Богаткін Д.</div>
        <div id="date_2" class="editable" contenteditable="true">20 лютого, 23:48</div>
        <div id="sum_2" class="editable plus" contenteditable="true">+ 1 200.00</div>

        <div id="name_3" class="editable" contenteditable="true">PAYSEND</div>
        <div id="date_3" class="editable" contenteditable="true">20 лютого, 23:26</div>
        <div id="sum_3" class="editable plus" contenteditable="true">+ 2 400.00</div>
    </div>
</body>
</html>
