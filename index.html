<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мій Банк</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        @font-face { font-family: 'Manrope'; src: url('Manrope.ttf'); }
        @font-face { font-family: 'Manrope-Bold'; src: url('Manrope-Bold.ttf'); }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; color: white; overflow: hidden;
            font-family: 'Manrope', sans-serif;
        }

        .container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: url('photo.png') no-repeat center/100% 100%;
        }

        .editable { position: absolute; border: none; background: transparent; color: inherit; font-family: inherit; outline: none; white-space: nowrap; }

        /* Кольори */
        .plus { color: #5cc033 !important; }
        .minus { color: #ccc !important; }

        /* Картка */
        #card_digits { left: 24%; top: 34%; font-size: 1.8vh; }
        #card_date { left: 37%; top: 34%; font-size: 1.8vh; }

        /* Головний БАЛАНС */
        #balance { right: 17.5%; top: 40.5%; font-size: 2.5vh; width: 60%; text-align: right; }
        #balance span { font-size: 1.9vh; }

        /* ІСТОРІЯ: Контейнер */
        .sum-container { 
            position: absolute; right: 15%; display: flex; align-items: baseline; justify-content: flex-end; width: 45%; 
        }

        /* Стиль для копійок в історії та UAH */
        .small-text { font-size: 1.3vh; font-family: 'Manrope-Bold'; margin-left: 1px; }
        .uah { margin-left: 4px; }

        /* Координати історії (твої) */
        #name_1 { left: 20%; top: 69.95%; font-family: 'Manrope-Bold'; font-size: 1.6vh; }
        #date_1 { left: 20%; top: 72%; font-family: 'Manrope-Bold'; font-size: 1.4vh; color: #888; }
        .row-1 { top: 69.95%; }

        #name_2 { left: 20%; top: 76.65%; font-family: 'Manrope-Bold'; font-size: 1.6vh; }
        #date_2 { left: 20%; top: 78.7%; font-family: 'Manrope-Bold'; font-size: 1.4vh; color: #888; }
        .row-2 { top: 76.65%; }

        #name_3 { left: 20%; top: 83.5%; font-family: 'Manrope-Bold'; font-size: 1.6vh; }
        #date_3 { left: 20%; top: 85.55%; font-family: 'Manrope-Bold'; font-size: 1.4vh; color: #888; }
        .row-3 { top: 83.5%; }

        .sum-val { position: static !important; font-family: 'Manrope-Bold'; font-size: 1.7vh; }
    </style>
</head>
<body>
    <div class="container">
        <div id="card_digits" class="editable" contenteditable="true">4504</div>
        <div id="card_date" class="editable" contenteditable="true">15/15</div>
        <div id="balance" class="editable" contenteditable="true">55 345<span>.50</span></div>

        <div id="name_1" class="editable" contenteditable="true">Сільпо</div>
        <div id="date_1" class="editable" contenteditable="true">20 лютого, 23:49</div>
        <div class="sum-container row-1 minus">
            <div id="sum_1" class="editable sum-val" contenteditable="true">- 150.00</div>
            <span class="uah small-text">UAH</span>
        </div>

        <div id="name_2" class="editable" contenteditable="true">Богаткін Д.</div>
        <div id="date_2" class="editable" contenteditable="true">20 лютого, 23:48</div>
        <div class="sum-container row-2 plus">
            <div id="sum_2" class="editable sum-val" contenteditable="true">+ 1 200.00</div>
            <span class="uah small-text">UAH</span>
        </div>

        <div id="name_3" class="editable" contenteditable="true">PAYSEND</div>
        <div id="date_3" class="editable" contenteditable="true">20 лютого, 23:26</div>
        <div class="sum-container row-3 plus">
            <div id="sum_3" class="editable sum-val" contenteditable="true">+ 2 400.00</div>
            <span class="uah small-text">UAH</span>
        </div>
    </div>

    <script>
        const sumInputs = document.querySelectorAll('.sum-val');

        function formatSum(el) {
            const text = el.innerText.trim();
            const container = el.parentElement;
            
            // Зміна кольору всього контейнера (сума + UAH)
            if (text.startsWith('+')) {
                container.className = container.className.replace('minus', 'plus');
            } else {
                container.className = container.className.replace('plus', 'minus');
            }

            // Логіка зменшення копійок
            if (text.includes('.')) {
                const parts = text.split('.');
                el.innerHTML = parts[0] + '<span class="small-text">.' + parts[1] + '</span>';
                
                // Ставимо курсор в кінець після оновлення HTML
                const range = document.createRange();
                const sel = window.getSelection();
                range.selectNodeContents(el);
                range.collapse(false);
                sel.removeAllRanges();
                sel.addRange(range);
            }
        }

        sumInputs.forEach(input => {
            // Викликаємо один раз при завантаженні для правильного вигляду
            formatSum(input);

            input.addEventListener('input', function() {
                const text = this.innerText;
                const container = this.parentElement;
                
                if (text.startsWith('+')) {
                    container.classList.remove('minus');
                    container.classList.add('plus');
                } else {
                    container.classList.remove('plus');
                    container.classList.add('minus');
                }
            });
        });
    </script>
</body>
</html>
