<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мій Банк</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        @font-face { font-family: 'Manrope'; src: url('Manrope.ttf'); }
        @font-face { font-family: 'Manrope-Bold'; src: url('Manrope-Bold.ttf'); }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; color: white; overflow: hidden;
            font-family: 'Manrope', sans-serif;
        }

        .container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: url('photo.png') no-repeat center/100% 100%;
        }

        .editable { 
            position: absolute; border: none; background: transparent; 
            color: inherit; font-family: inherit; outline: none; white-space: nowrap; 
        }

        /* Кольори */
        .plus { color: #5cc033 !important; }
        .minus { color: #ccc !important; }

        /* Стиль іконок (ідеальне вирівнювання) */
        .transaction-icon {
            position: absolute;
            left: 10.5%; /* Твоя позиція іконок */
            width: 3.4vh; 
            height: 3.4vh;
            object-fit: contain;
            pointer-events: none;
        }

        /* Картка та Баланс */
        #card_digits { left: 24%; top: 34%; font-size: 1.8vh; }
        #card_date { left: 34%; top: 34%; font-size: 1.8vh; }
        #balance { right: 17.5%; top: 40%; font-size: 2.5vh; width: 60%; text-align: right; }
        #balance span { font-size: 1.9vh; }

        /* Контейнер для суми (цифри + UAH) */
        .sum-container { 
            position: absolute; right: 15%; display: flex; 
            align-items: baseline; justify-content: flex-end; width: 45%; 
        }

        /* Маленький текст для копійок та UAH */
        .small-text { font-size: 1.3vh; font-family: 'Manrope-Bold'; }
        .uah { margin-left: 4px; }

        /* Рядки історії (твої координати) */
        .row-1-pos { top: 69.95%; }
        .row-2-pos { top: 76.65%; }
        .row-3-pos { top: 83.5%; }

        .name { left: 20%; font-family: 'Manrope-Bold'; font-size: 1.6vh; }
        .date { left: 20%; font-family: 'Manrope-Bold'; font-size: 1.4vh; color: #888; margin-top: 2.1vh; }
        .sum-val { position: static !important; font-family: 'Manrope-Bold'; font-size: 1.7vh; }
    </style>
</head>
<body>
    <div class="container">
        <div id="card_digits" class="editable" contenteditable="true">4504</div>
        <div id="card_date" class="editable" contenteditable="true">15/15</div>
        <div id="balance" class="editable" contenteditable="true">55 345<span>.50</span></div>

        <img id="img_1" src="minus.png" class="transaction-icon row-1-pos">
        <div id="name_1" class="editable name row-1-pos" contenteditable="true">Сільпо</div>
        <div id="date_1" class="editable date row-1-pos" contenteditable="true">20 лютого, 23:49</div>
        <div id="cont_1" class="sum-container row-1-pos">
            <div id="sum_1" class="editable sum-val" contenteditable="true">- 150.00</div>
            <span class="uah small-text">UAH</span>
        </div>

        <img id="img_2" src="plus.png" class="transaction-icon row-2-pos">
        <div id="name_2" class="editable name row-2-pos" contenteditable="true">Богаткін Д.</div>
        <div id="date_2" class="editable date row-2-pos" contenteditable="true">20 лютого, 23:48</div>
        <div id="cont_2" class="sum-container row-2-pos">
            <div id="sum_2" class="editable sum-val" contenteditable="true">+ 1 200.00</div>
            <span class="uah small-text">UAH</span>
        </div>

        <img id="img_3" src="plus.png" class="transaction-icon row-3-pos">
        <div id="name_3" class="editable name row-3-pos" contenteditable="true">PAYSEND</div>
        <div id="date_3" class="editable date row-3-pos" contenteditable="true">20 лютого, 23:26</div>
        <div id="cont_3" class="sum-container row-3-pos">
            <div id="sum_3" class="editable sum-val" contenteditable="true">+ 2 400.00</div>
            <span class="uah small-text">UAH</span>
        </div>
    </div>

    <script>
        function updateRow(el) {
            const text = el.innerText.trim();
            const container = el.parentElement;
            const id = el.id.split('_')[1];
            const img = document.getElementById('img_' + id);
            const uah = container.querySelector('.uah');

            // 1. Колір та картинка
            if (text.startsWith('+')) {
                container.classList.remove('minus');
                container.classList.add('plus');
                img.src = 'plus.png?v=' + Date.now();
            } else {
                container.classList.remove('plus');
                container.classList.add('minus');
                img.src = 'minus.png?v=' + Date.now();
            }

            // 2. Ефект маленьких копійок
            if (text.includes('.') && !el.querySelector('.small-text')) {
                const parts = text.split('.');
                el.innerHTML = parts[0] + '<span class="small-text">.' + parts[1] + '</span>';
                
                // Повертаємо курсор в кінець
                const range = document.createRange();
                const sel = window.getSelection();
                range.selectNodeContents(el);
                range.collapse(false);
                sel.removeAllRanges();
                sel.addRange(range);
            }
        }

        document.querySelectorAll('.sum-val').forEach(input => {
            updateRow(input); // Ініціалізація
            input.addEventListener('input', () => updateRow(input));
        });
    </script>
</body>
</html>
